name: Public CI
on:
  workflow_call:

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Validate repository bootstrap
        run: node .github/scripts/check-bootstrap.mjs
      - name: Install locked development dependencies
        run: npm ci --include=dev
      - name: Build local foundation
        run: npm run build
      - name: Check consumer types
        run: npm run typecheck
      - name: Test schema and contrast
        run: npm test
