name: Public CI
on:
  workflow_call:

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - name: Validate repository bootstrap
        run: node .github/scripts/check-bootstrap.mjs
      - name: Install locked development dependencies
        run: npm ci --include=dev
      - name: Build local foundation
        run: npm run build
      - name: Check consumer types
        run: npm run typecheck
      - name: Test schema and contrast
        run: npm test
      - name: Check package content and install smoke test
        run: npm run check:package -- --out "$RUNNER_TEMP/package"
      - name: Upload pre-publication tarball
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: alphabros-themes-${{ github.sha }}
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error
          retention-days: 30
